// DLsiteSound MoriMod - root build script
//
// 工具链版本矩阵（Compose Material3 Expressive 需要）：
//   Gradle 8.13 · AGP 8.12.3 · Kotlin 2.2.0 · Compose compiler plugin 2.2.0
//   compileSdk 36 · buildTools 36.0.0
//   Compose 显式钉版本（不用 BOM）：material3 1.4.0（首个含 Expressive API 的稳定版）
//   + ui 1.8.2 / ui-text 1.8.1（material3 1.4.0 的官方对齐版本）
plugins {
    id 'com.android.application' version '8.12.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.0' apply false
    // Compose 编译器从 Kotlin 2.0 起随 Kotlin 插件分发，不再需要 kotlinCompilerExtensionVersion
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0' apply false
}